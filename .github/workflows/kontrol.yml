# PR'larda yayından önce kontrol: Stüdyo derlenir (tsc + vite), Edge Function'ların tipleri denetlenir. Yayın yapmaz.
name: Kontrol
on:
  pull_request:
    branches: [main]
permissions: { contents: read }
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
  fonksiyonlar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Tip denetimi
        run: |
          # Hatalar Actions özetinde de görünsün diye ::error notu olarak yazılır (ilk 2500 karakter)
          for f in supabase/functions/*/index.ts; do
            echo "== $f"
            if ! deno check --node-modules-dir=none "$f" > /tmp/c.log 2>&1; then
              hata=1; cat /tmp/c.log
              node -e "const t=require('fs').readFileSync('/tmp/c.log','utf8').replace(/\x1b\[[0-9;]*m/g,'').slice(0,2500);console.log('::error title='+process.argv[1]+'::'+t.replace(/%/g,'%25').replace(/\r/g,'').replace(/\n/g,'%0A'))" "$f"
            fi
          done
          exit ${hata:-0}
