# UPDATED Kamera iPhone/iPad sürümü. Xcode projesi bu dosyadan üretilir (xcodegen generate); .xcodeproj depoya girmez.
# Derleme ve TestFlight yüklemesi: .github/workflows/ios.yml (GitHub'ın Mac makinesi, Mac gerekmez).
name: UpdatedKamera
options:
  bundleIdPrefix: tr.com.updated
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    MARKETING_VERSION: "0.10.1"
    # İlk TestFlight yüklemesi: 27 Ekim 2026
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  UpdatedKamera:
    type: application
    platform: iOS
    sources: [Kamera]
    dependencies:
      - target: EkranYayini
    scheme:
      testTargets: [Gezinti]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.com.updated.monitor
        PRODUCT_NAME: UpdatedKamera
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Kamera/Info.plist
      properties:
        CFBundleDisplayName: UPDATED Kamera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Fotoğraf ve video çekmek için kamera gerekiyor.
        NSMicrophoneUsageDescription: Videoya ses kaydetmek için mikrofon gerekiyor.
        NSPhotoLibraryAddUsageDescription: Çekimleri Fotoğraflar'a kaydetmek için.
        NSLocalNetworkUsageDescription: Masa ile Wi-Fi kameralar aynı ağda birbirini bulsun diye.
        NSBonjourServices: [_updatedkam._tcp]
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  # Simülatörde tüm ekranları gezen arayüz testi (CI: gezinti işi, ekran görüntüleri yapıt olarak)
  Gezinti:
    type: bundle.ui-testing
    platform: iOS
    sources: [Gezinti]
    dependencies:
      - target: UpdatedKamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.com.updated.monitor.gezinti
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: UpdatedKamera
  # Ekranı Masa'ya gönder: ReplayKit yayın uzantısı (kendi Wi-Fi yayını olmayan kameralar için, üreticinin uygulaması açıkken)
  EkranYayini:
    type: app-extension
    platform: iOS
    sources:
      - Ekran
      - Kamera/AgYayin.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.com.updated.monitor.ekran
        PRODUCT_NAME: EkranYayini
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Ekran/Info.plist
      properties:
        CFBundleDisplayName: UPDATED Ekran
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Ekran görüntüsü aynı Wi-Fi'daki masaya gitsin diye.
        NSBonjourServices: [_updatedkam._tcp]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).YayinIsleyici
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
