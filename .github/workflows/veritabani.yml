# Seçilen göç dosyasını (supabase/migrations/NNNN_*.sql) Supabase'te çalıştırır. Yalnız elle tetiklenir (Actions → "Veritabanı göçü" → Run workflow):
# göçler bağlantı (connector) ile de uygulanıyor; otomatik çalışsaydı aynı dosya iki kez çalışabilirdi.
# Gerekli secret: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens) — fonksiyon yayınıyla aynı anahtar.
name: Veritabanı göçü
on:
  workflow_dispatch:
    inputs:
      dosya: { description: 'Göç dosyası (ör. 0024_site_paneli.sql)', required: true }
permissions: { contents: read }
concurrency: { group: veritabani, cancel-in-progress: false }
jobs:
  uygula:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJE: fulmooonidwrqyybbkvu
      DOSYA: ${{ github.event.inputs.dosya }}
    steps:
      - uses: actions/checkout@v4
      - name: Uygula
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error title=Veritabanı göçü::SUPABASE_ACCESS_TOKEN secret'ı yok."; exit 1; }
          f="supabase/migrations/$(basename "$DOSYA")"
          [ -f "$f" ] || { echo "::error title=Veritabanı göçü::$f bulunamadı"; exit 1; }
          jq -n --rawfile q "$f" '{query: $q}' > /tmp/govde.json
          kod=$(curl -sS -o /tmp/cevap.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJE/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/govde.json)
          if [ "$kod" -ge 200 ] && [ "$kod" -lt 300 ]; then echo "::notice title=Uygulandı::$f"; else echo "::error title=Uygulanamadı ($kod)::$(head -c 600 /tmp/cevap.json)"; exit 1; fi
