# PR'larda yayından önce kontrol: Stüdyo derlenir (tsc + vite), Edge Function'ların tipleri denetlenir. Yayın yapmaz.
name: Kontrol
on:
  pull_request:
    branches: [main]
permissions: { contents: read }
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
  fonksiyonlar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Tip denetimi
        run: |
          for f in supabase/functions/*/index.ts; do echo "== $f"; deno check "$f" || hata=1; done
          exit ${hata:-0}
