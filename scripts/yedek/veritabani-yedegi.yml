# Stüdyo veritabanının günlük yedeği. Bu dosya ÖZEL depoya (updated-studio/yedek) .github/workflows/ altına konur.
# Bu (herkese açık) depoda sadece şablon olarak durur; burada çalışmaz.
# GitHub'ın kendi sunucularında, her gece kendiliğinden çalışır; kimsenin bilgisayarı ya da Claude gerekmez.
# Gizli bilgiler (yedek deposu → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL: Supabase → Connect → "Session pooler" adresi, KOPYALANDIĞI GİBİ ([YOUR-PASSWORD] içinde kalabilir).
#   SUPABASE_DB_PASSWORD: veritabanı şifresi. Adresteki [YOUR-PASSWORD] yerine bu konur (adrese şifre elle yazıldıysa gerekmez).
#   IPv4 olduğu için "Session pooler" adresi kullanılır.
# Geri yükleme: ARCHITECTURE.md 13.6 "Veritabanı bozuldu / silindi".
name: Veritabanı yedeği
on:
  schedule:
    - cron: "15 0 * * *"   # her gün 03:15 (Türkiye)
  workflow_dispatch: {}    # Actions sekmesinden "Run workflow" ile elle de çalışır
  push:
    branches: [main]
    paths: [".github/workflows/**"]   # şablon depoya ilk konduğunda (ve değiştiğinde) hemen bir yedek alınır
permissions:
  contents: write
jobs:
  yedek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Yedek al
        env:
          DB_HAM: ${{ secrets.SUPABASE_DB_URL }}
          DB_SIFRE: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # adresteki [YOUR-PASSWORD] yerine şifre (adrese uygun biçimde kodlanarak) konur
          DB=$(python3 -c 'import os,urllib.parse as u; a=os.environ.get("DB_HAM","").strip(); p=os.environ.get("DB_SIFRE",""); print(a.replace("[YOUR-PASSWORD]", u.quote(p, safe="")) if p else a)')
          # birleştirilmiş adres ve kodlanmış şifre kayıtlarda (log) görünmesin
          [ -n "$DB" ] && echo "::add-mask::$DB"
          [ -n "$DB_SIFRE" ] && echo "::add-mask::$(python3 -c 'import os,urllib.parse as u; print(u.quote(os.environ["DB_SIFRE"], safe=""))')"
          if [ -n "$DB" ] && [[ "$DB" == *"[YOUR-PASSWORD]"* ]]; then echo "Adreste [YOUR-PASSWORD] duruyor ama SUPABASE_DB_PASSWORD girilmemiş"; exit 1; fi
          if [ -z "$DB" ]; then
            # Kurulum anında gizli bilgi henüz girilmemiş olabilir: o zaman sessizce bekle. Gece çalışmasında yoksa hata ver (fark edilsin).
            if [ "${{ github.event_name }}" = "schedule" ]; then echo "SUPABASE_DB_URL gizli bilgisi yok"; exit 1; fi
            echo "SUPABASE_DB_URL henüz girilmemiş; yedek atlandı." >> "$GITHUB_STEP_SUMMARY"; echo "ATLA=1" >> "$GITHUB_ENV"; exit 0
          fi
          mkdir -p yedek
          supabase db dump --db-url "$DB" -f yedek/roller.sql --role-only
          supabase db dump --db-url "$DB" -f yedek/sema.sql
          supabase db dump --db-url "$DB" -f yedek/veri.sql --data-only --use-copy
          date -u +"%Y-%m-%dT%H:%M:%SZ" > yedek/SON_YEDEK.txt
          ls -la yedek
      - name: Depoya kaydet
        if: env.ATLA != '1'
        run: |
          git config user.name "Stüdyo yedek"
          git config user.email "yedek@users.noreply.github.com"
          git add yedek
          git commit -m "Yedek $(date -u +%Y-%m-%d) [skip ci]" || echo "Değişiklik yok"
          git push
