# supabase/functions/ altında değişen fonksiyonu Supabase'e yayınlar (panelde Code → Deploy updates yerine).
# Gerekli secret: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens). Yoksa iş atlanır.
name: Fonksiyon yayını
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
    inputs:
      fonksiyon: { description: 'Fonksiyon adı (boş = hepsi)', required: false }
permissions: { contents: read }
concurrency: { group: fonksiyonlar, cancel-in-progress: false }
jobs:
  yayinla:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJE: fulmooonidwrqyybbkvu
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Anahtar var mı
        id: k
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning title=Fonksiyon yayını::SUPABASE_ACCESS_TOKEN secret'ı yok; fonksiyon panelden elle yayınlanmalı."; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.k.outputs.ok == '1'
        uses: supabase/setup-cli@v1
        with: { version: 2.54.11 }
      - if: steps.k.outputs.ok == '1'
        run: |
          if [ -n "${{ github.event.inputs.fonksiyon }}" ]; then liste="${{ github.event.inputs.fonksiyon }}"
          elif [ "${{ github.event_name }}" = workflow_dispatch ]; then liste=$(ls supabase/functions)
          else liste=$(git diff --name-only HEAD~1 HEAD -- supabase/functions | cut -d/ -f3 | sort -u); fi
          for f in $liste; do
            [ -f "supabase/functions/$f/index.ts" ] || continue
            # Tüm fonksiyonlar "Verify JWT" kapalı çalışıyor (zamanlanmış görevler anahtarsız çağırır; üyelik kodda denetlenir)
            if supabase functions deploy "$f" --project-ref "$PROJE" --no-verify-jwt --use-api; then echo "::notice title=Yayınlandı::$f"; else echo "::error title=Yayınlanamadı::$f"; hata=1; fi
          done
          exit ${hata:-0}
