<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1D21" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Updated Stüdyo" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.json" />
    <!-- Yazı tipleri kendi sunucumuzda (Google'a bağlanılmaz): public/yazi-tipleri; yenilemek için site deposu deploy/yazi-tipi-indir.mjs -->
    <link rel="stylesheet" href="./yazi-tipleri/yazi-tipleri.css" />
    <title>Updated Stüdyo</title>
    <style>
      /* Açılış ekranı: telefonun kendi açılış ekranıyla aynı renk ve boyut (#1B1D21, ikon zemini de bu renk), dikiş görünmesin; uygulama yüklenince kaybolur (main.tsx) */
      #acilis { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #1B1D21; transition: opacity .35s ease; }
      #acilis i { width: 89px; height: 120px; background: #F1F3F6; -webkit-mask: url("./isaret.png") center / contain no-repeat; mask: url("./isaret.png") center / contain no-repeat; animation: acilis-gel .6s cubic-bezier(.2,.8,.2,1) both; }
      #acilis.git { opacity: 0; pointer-events: none; }
      @keyframes acilis-gel { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #acilis i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="acilis" aria-hidden="true"><i></i></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
