# Stüdyo veritabanının günlük yedeği. Bu dosya ÖZEL depoya (updated-studio/yedek) .github/workflows/ altına konur.
# Bu (herkese açık) depoda sadece şablon olarak durur; burada çalışmaz.
# GitHub'ın kendi sunucularında, her gece kendiliğinden çalışır; kimsenin bilgisayarı ya da Claude gerekmez.
# Gizli bilgiler (yedek deposu → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL: Supabase → Connect → "Session pooler" adresi, KOPYALANDIĞI GİBİ ([YOUR-PASSWORD] içinde kalabilir).
#   SUPABASE_DB_PASSWORD: veritabanı şifresi. Adresteki [YOUR-PASSWORD] yerine bu konur (adrese şifre elle yazıldıysa gerekmez).
#   IPv4 olduğu için "Session pooler" adresi kullanılır.
# Geri yükleme: ARCHITECTURE.md 13.6 "Veritabanı bozuldu / silindi".
name: Veritabanı yedeği
on:
  schedule:
    - cron: "15 0 * * *"   # her gün 03:15 (Türkiye)
  workflow_dispatch: {}    # Actions sekmesinden "Run workflow" ile elle de çalışır
  push:
    branches: [main]
    paths: [".github/workflows/**"]   # şablon depoya ilk konduğunda (ve değiştiğinde) hemen bir yedek alınır
permissions:
  contents: write
jobs:
  yedek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Yedek al
        env:
          DB_HAM: ${{ secrets.SUPABASE_DB_URL }}
          DB_SIFRE: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJE: fulmooonidwrqyybbkvu
          BOLGE: eu-central-1
        run: |
          set -euo pipefail
          # Bağlantı adresi: SUPABASE_DB_URL girildiyse o ([YOUR-PASSWORD] yerine şifre konur), yoksa ya da çalışmazsa
          # proje kimliği ve bölgeden Supabase'in "Session pooler" adresi kurulur (iki olası sunucu denenir). Gereken tek gizli bilgi şifre.
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          ADAYLAR=$(python3 - <<'PY'
          import os, urllib.parse as u
          ref, bolge = os.environ["PROJE"], os.environ["BOLGE"]
          ham, sifre = os.environ.get("DB_HAM", "").strip(), os.environ.get("DB_SIFRE", "")
          q = u.quote(sifre, safe="")
          out = []
          if ham.startswith("postgres"): out.append(ham.replace("[YOUR-PASSWORD]", q) if sifre else ham)
          if sifre:
              for n in ("aws-0", "aws-1"):
                  out.append(f"postgresql://postgres.{ref}:{q}@{n}-{bolge}.pooler.supabase.com:5432/postgres")
          print("\n".join(out))
          PY
          )
          DB=""
          while IFS= read -r aday; do
            [ -z "$aday" ] && continue
            echo "::add-mask::$aday"
            if PGCONNECT_TIMEOUT=15 psql "$aday" -tAc "select 1" >/dev/null 2>&1; then DB="$aday"; break; fi
          done <<< "$ADAYLAR"
          [ -n "$DB_SIFRE" ] && echo "::add-mask::$(python3 -c 'import os,urllib.parse as u; print(u.quote(os.environ["DB_SIFRE"], safe=""))')"
          if [ -z "$DB" ]; then
            if [ -z "$DB_SIFRE" ] && [ -z "$DB_HAM" ] && [ "${{ github.event_name }}" != "schedule" ]; then
              # kurulum anında gizli bilgi henüz girilmemiş: sessizce bekle
              echo "Veritabanı şifresi (SUPABASE_DB_PASSWORD) henüz girilmemiş; yedek atlandı." >> "$GITHUB_STEP_SUMMARY"; echo "ATLA=1" >> "$GITHUB_ENV"; exit 0
            fi
            echo "Veritabanına bağlanılamadı. SUPABASE_DB_PASSWORD doğru mu? (Supabase'te şifre değiştiyse burada da güncellenmeli)"; exit 1
          fi
          mkdir -p yedek
          supabase db dump --db-url "$DB" -f yedek/roller.sql --role-only
          supabase db dump --db-url "$DB" -f yedek/sema.sql
          supabase db dump --db-url "$DB" -f yedek/veri.sql --data-only --use-copy
          date -u +"%Y-%m-%dT%H:%M:%SZ" > yedek/SON_YEDEK.txt
          ls -la yedek
      - name: Depoya kaydet
        if: env.ATLA != '1'
        run: |
          git config user.name "Stüdyo yedek"
          git config user.email "yedek@users.noreply.github.com"
          git add yedek
          git commit -m "Yedek $(date -u +%Y-%m-%d) [skip ci]" || echo "Değişiklik yok"
          git push
