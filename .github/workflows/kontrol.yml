# PR'larda yayından önce kontrol: Stüdyo derlenir (tsc + vite), Edge Function'ların tipleri denetlenir. Yayın yapmaz.
# Fonksiyonlarda Supabase istemcisi tipsiz kullanıldığı için eski kodda bilinen tip uyarıları var; yalnız ana dala göre YENİ hata başarısız sayılır.
name: Kontrol
on:
  pull_request:
    branches: [main]
permissions: { contents: read }
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
  fonksiyonlar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Tip denetimi (yalnız yeni hatalar)
        run: |
          # Hata imzası: dosya + kod + ilk satır (satır numarası yok; kod kayınca eski hata "yeni" sayılmasın)
          imza() {
            for f in supabase/functions/*/index.ts; do
              deno check --node-modules-dir=none "$f" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | awk -v d="$(dirname "$f")" '
                /^TS[0-9]+ \[ERROR\]/ { m=$0; next }
                m && /at file:/ { sub(/.*\/supabase\//,"supabase/"); sub(/:[0-9]+:[0-9]+$/,""); print $0 " | " m; m="" }'
            done | sort -u
          }
          imza > /tmp/pr.txt
          git checkout -q "origin/${{ github.base_ref }}"
          imza > /tmp/ana.txt
          git checkout -q -
          # Tipsiz Supabase istemcisinden gelen 'never' uyarıları bilinen sınıf; sayılmaz
          comm -13 /tmp/ana.txt /tmp/pr.txt | grep -v "'never" > /tmp/yeni.txt || true
          echo "::notice title=Tip denetimi::ana dal: $(wc -l < /tmp/ana.txt) bilinen · PR: $(wc -l < /tmp/pr.txt) · yeni: $(wc -l < /tmp/yeni.txt)"
          if [ -s /tmp/yeni.txt ]; then
            cat /tmp/yeni.txt
            node -e "const t=require('fs').readFileSync('/tmp/yeni.txt','utf8').slice(0,3000);console.log('::error title=Yeni tip hataları::'+t.replace(/%/g,'%25').replace(/\n/g,'%0A'))"
            exit 1
          fi
