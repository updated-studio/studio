<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1D21" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Updated Stüdyo" />
    <link rel="icon" type="image/png" href="./icon-180.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" />
    <title>Updated Stüdyo</title>
    <style>
      /* Açılış ekranı: tema rengiyle, arka plansız logo; uygulama yüklenince kaybolur (main.tsx) */
      #acilis { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #F3F6FC; transition: opacity .35s ease; }
      #acilis i { width: 84px; height: 104px; background: #0E1A33; -webkit-mask: url("./logo.png") center / contain no-repeat; mask: url("./logo.png") center / contain no-repeat; animation: acilis-gel .6s cubic-bezier(.2,.8,.2,1) both; }
      #acilis.git { opacity: 0; pointer-events: none; }
      @keyframes acilis-gel { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
      @media (prefers-color-scheme: dark) { #acilis { background: #1B1D21; } #acilis i { background: #F1F3F6; } }
      @media (prefers-reduced-motion: reduce) { #acilis i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="acilis" aria-hidden="true"><i></i></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
